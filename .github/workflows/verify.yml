name: Verify application

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_DATABASE: sop_gatekeeper_test
          MYSQL_USER: gatekeeper_test
          MYSQL_PASSWORD: ci-test-only-password
          MYSQL_ROOT_PASSWORD: ci-root-only-password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      GATEKEEPER_TEST_DB_PASSWORD: ci-test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package backend
        run: bash backend/mvnw -B -f backend/pom.xml verify
      - name: Preserve backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-verification
          path: |
            backend/target/surefire-reports/
            backend/target/test-logs/
          retention-days: 14

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@9.6.7
      - run: npm ci
      - name: Headless browser tests with coverage
        run: |
          set -o pipefail
          export CHROME_BIN="$(command -v google-chrome)"
          npm test -- --watch=false --browsers=ChromeHeadless --code-coverage 2>&1 | tee test-output.log
      - name: Production build
        run: npm run build
      - name: Preserve frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-verification
          path: |
            frontend/coverage/
            frontend/test-output.log
          retention-days: 14
