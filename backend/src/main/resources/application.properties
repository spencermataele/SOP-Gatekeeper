spring.application.name=Woven1

spring.datasource.url=jdbc:mysql://localhost:3306/woven?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=woven
spring.datasource.password=woven
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=${PORT:8080}
server.error.include-binding-errors=always
server.error.include-message=always
spring.mvc.problemdetails.enabled=true
logging.level.org.springframework.web=INFO

app.jwt.secret=well!the@cats#out$of%the^bag&now
app.jwt.expirationMs=86400000

spring.security.filter.dispatcher-types=REQUEST, ERROR

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

management.endpoints.web.exposure.include=mappings,health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.endpoints.web.base-path=/actuator