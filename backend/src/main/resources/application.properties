spring.application.name=Woven1

spring.datasource.url=jdbc:mysql://localhost:3306/woven?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=woven
spring.datasource.password=woven
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
