spring.application.name=Woven1

spring:
    datasource:
        url: jdbc:mysql://localhost:3306/woven?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: woven
        password: woven
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true
        open-in-view: false
    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true


---
spring:
    config:
        activate:
            on-profile: docker
    datasource:
        url: jdbc:mysql://db:3306/woven?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: woven
        password: woven