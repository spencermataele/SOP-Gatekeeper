<section class="container"><h2>{{id?'Edit':'Create'}} Business Process</h2><p role="alert" *ngIf="error">{{error}}</p><p *ngIf="loading">Loading…</p>
<form *ngIf="!loading" [formGroup]="form" (ngSubmit)="save()">
 <label>Name<input formControlName="businessProcessName" maxlength="255"></label>
 <app-admin-parent-selector target="family" formControlName="businessProcessFamilyId"></app-admin-parent-selector>
 <p>The process inherits its subdepartment and department from its family.</p>
 <label>Related parent process (optional, within this family)<select formControlName="parentBusinessProcessId"><option [ngValue]="null">None</option><option *ngFor="let p of parents" [ngValue]="p.businessProcessId">{{p.businessProcessName}}</option></select></label>
 <div class="actions"><button [disabled]="saving || form.invalid">Save</button><button type="button" (click)="cancel()">Cancel</button></div>
</form></section>
