<section class="container" *ngIf="!loading; else busy">
  <h2>{{ id ? 'Edit' : 'Create' }} Business Process Family</h2>

  <form [formGroup]="form" (ngSubmit)="save()">
    <label>
      Name
      <input formControlName="businessProcessFamilyName" maxlength="255">
    </label>

    <app-admin-parent-selector target="subgroup" formControlName="deptSubgroupId"></app-admin-parent-selector>

    <div class="actions">
      <button type="submit" [disabled]="saving || form.invalid">Save</button>
      <button type="button" (click)="cancel()">Cancel</button>
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>
  </form>
</section>

<ng-template #busy>Loading…</ng-template>
