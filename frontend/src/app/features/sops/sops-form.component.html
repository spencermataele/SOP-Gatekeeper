<h2>{{ id == null ? 'Create SOP' : 'Edit SOP' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()" class="form">
  <div class="grid">
    <label>Title
      <input formControlName="title" />
    </label>
    <div class="err" *ngIf="form.get('title')?.touched && form.get('title')?.errors">
      <span *ngIf="form.get('title')?.hasError('required')">Required.</span>
      <span *ngIf="form.get('title')?.hasError('maxlength')">Max 255 chars.</span>
      <span *ngIf="form.get('title')?.errors?.['api']">{{ form.get('title')?.errors?.['api'] }}</span>
    </div>

    <label>Author Name
      <input formControlName="authorName" />
    </label>
    <div class="err" *ngIf="form.get('authorName')?.touched && form.get('authorName')?.errors">
      <span *ngIf="form.get('authorName')?.hasError('required')">Required.</span>
      <span *ngIf="form.get('authorName')?.hasError('maxlength')">Max 255 chars.</span>
    </div>

    <div>
      <label>Business Process
        <select formControlName="businessProcessId" [disabled]="!form.value.businessProcessFamilyId" (change)="onProcessChange()">
          <option [ngValue]="null">-- select process --</option>
          <option *ngFor="let p of filteredProcesses()" [ngValue]="p.businessProcessId">
            {{ p.businessProcessName }}
          </option>
        </select>
      </label>
      <button type="button" class="small-btn" (click)="goToNewBusinessProcess()">Add New Process</button>
    </div>

    <label>Business Process Family
      <select formControlName="businessProcessFamilyId" (change)="onProcessFamilyChange()">
        <option [ngValue]="null">-- select family --</option>
        <option *ngFor="let f of filteredFamilies()" [ngValue]="f.businessProcessFamilyId">
          {{ f.businessProcessFamilyName }}
        </option>
      </select>
    </label>

    <label>Parent Process
      <select formControlName="parentProcessId" [disabled]="!form.value.businessProcessFamilyId" (change)="onParentProcessChange()">
        <option [ngValue]="null"> --select parent process (optional)--</option>
        <option *ngFor="let p of filteredParentProcesses()" [ngValue]="p.businessProcessId">
          {{ p.businessProcessName }}
        </option>
      </select>
    </label>

    <label>Version ID
      <input type="number" formControlName="versionId" />
    </label>
  </div>

  <!-- Global filter -->
  <div class="filter">
    <label>Filter by name
      <input [formControl]="nameFilter" placeholder="Filters all dropdowns..." />
    </label>
    <button type="button" (click)="nameFilter.setValue('')">Clear</button>
  </div>

  <!-- Hierarchy -->
  <div class="grid">
    <label>Org
      <select formControlName="orgId" (change)="onOrgChange()">
        <option [ngValue]="null">-- select org --</option>
        <option *ngFor="let o of filteredOrgs()" [ngValue]="o.orgId">{{ o.orgName }}</option>
      </select>
    </label>

    <label>Org Group
      <select formControlName="orgGroupId" (change)="onGroupChange()">
        <option [ngValue]="null">-- select group --</option>
        <option *ngFor="let g of filteredGroups()" [ngValue]="g.orgGroupId">{{ g.orgGroupName }}</option>
      </select>
    </label>

    <label>Department
      <select formControlName="departmentId" (change)="onDeptChange()">
        <option [ngValue]="null">-- select department --</option>
        <option *ngFor="let d of filteredDepts()" [ngValue]="d.departmentId">{{ d.departmentName }}</option>
      </select>
    </label>

    <label>Dept Subgroup
      <select formControlName="deptSubgroupId" (change)="onSubChange()">
        <option [ngValue]="null">-- select subgroup --</option>
        <option *ngFor="let s of filteredSubs()" [ngValue]="s.deptSubgroupId">{{ s.deptSubgroupName }}</option>
      </select>
    </label>

    <div>
      <label>Process Owner
        <select formControlName="processOwnerId">
          <option [ngValue]="null">-- select owner --</option>
          <option *ngFor="let p of filteredOwners()" [ngValue]="p.processOwnerId">
            {{ p.name }}
          </option>
        </select>
      </label>
      <button type="button" class="small-btn" (click)="goToNewProcessOwner()">Add New Process Owner</button>
    </div>
  </div>

  <div>
    <div class="sop-description">
      <h3>SOP Description</h3>
      <input formControlName="sopDetails" placeholder="Brief description of this SOP" />
    </div>

    <h3>Steps</h3>
    <div formArrayName="steps" class="steps-section">
      <div *ngFor="let step of steps.controls; let i = index" [formGroupName]="i" class="step-card">
        <h4>Step {{ i + 1 }}</h4>
        <label>Step Title
          <input formControlName="title" placeholder="Enter step title" />
        </label>

        <div class="step-meta">
          <label>Who
            <input formControlName="who" placeholder="Who performs this step?" />
          </label>
          <label>Where
            <input formControlName="where" placeholder="Where it happens" />
          </label>
        </div>

        <label>Step Details
          <textarea rows="4" formControlName="details" placeholder="Describe what happens in this step..."></textarea>
        </label>
      </div>
    </div>
    <button type="button" class="small-btn" (click)="addStep()">＋ Add Step</button>
  </div>

  <div class="actions">
    <button type="submit" [disabled]="saving || form.invalid">{{ id == null ? 'Create SOP' : 'Save Changes' }}</button>
    <button *ngIf="id != null" type="button" class="danger" (click)="delete()">Delete</button>
    <span class="err" *ngIf="errorMsg">{{ errorMsg }}</span>
  </div>

</form>
