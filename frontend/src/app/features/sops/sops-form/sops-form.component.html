<div class="container">
  <h2>{{ id ? 'Edit SOP' : 'Create SOP' }}</h2>

  <div *ngIf="loading">Loading…</div>
  <div *ngIf="error" class="error">{{ error }}</div>

  <form [formGroup]="form" (ngSubmit)="save()" *ngIf="!loading">
    <fieldset>
      <legend>General</legend>
      <label>Title
        <input type="text" formControlName="title" />
      </label>
      <label>Version
        <input type="number" step="0.1" formControlName="versionId" />
      </label>
      <label>SOP Location Path
        <input type="text" formControlName="sopLocationPath" />
      </label>
    </fieldset>

    <fieldset>
      <legend>Ownership</legend>
      <label>Author ID <input type="number" formControlName="authorId" /></label>
      <!-- Dropdown menu for process owner -->
      <label>Current Process Owner ID
        <select formControlName="currentProcessOwnerId">
          <option [ngValue]="null">-- Select owner --</option>
          <option *ngFor="let o of owners" [ngValue]="o.processOwnerId">
            {{ o.name }} ({{ o.positionId }})
          </option>
        </select>
        <button [routerLink]="['/process-owners','new']" [queryParams]="{ backTo: '/sops/new' }">+ Add Owner</button>
      </label>
      <!-- FIXME auto fill position id when process owner selected from dropdown -->
      <label>Process Owner Position ID <input type="number" formControlName="currentProcessOwnerPositionId" /></label>
    </fieldset>
-
    <fieldset>
      <legend>Organization</legend>
      <label>Org ID <input type="number" formControlName="orgId" /></label>
      <label>Org Group ID <input type="number" formControlName="orgGroupId" /></label>
      <label>Department ID <input type="number" formControlName="departmentId" /></label>
      <label>Dept Subgroup ID <input type="number" formControlName="deptSubgroupId" /></label>
    </fieldset>

    <fieldset>
      <legend>Process</legend>
      <label>Process ID <input type="number" formControlName="processId" /></label>
      <label>Process Name <input type="text" formControlName="processName" /></label>
      <label>Process Family ID <input type="number" formControlName="processFamilyId" /></label>
      <label>Parent Process ID <input type="number" formControlName="parentProcessId" /></label>
    </fieldset>

    <fieldset>
      <legend>Details</legend>
      <label for="sopDetails">SOP Details</label>
      <textarea id="sopDetails" formControlName="sopDetails" rows="14" placeholder="Write the SOP body here (Markdown or plain text)"></textarea>
    </fieldset>

    <div class="actions">
      <button type="submit">Save</button>
      <button type="button" (click)="cancel()">Cancel</button>
    </div>
  </form>
</div>
