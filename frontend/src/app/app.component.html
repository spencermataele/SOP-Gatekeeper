<div class="app-shell" [class.lifecycle]="lifecycleEnabled">

  <aside class="sidebar">

    <div class="brand-logo">
      <span class="brand-name">Gatekeeper</span>
      <span class="brand-sub">Process Governance</span>
    </div>

    <nav aria-label="Published procedures" *ngIf="lifecycleEnabled">
      <a routerLink="/library" routerLinkActive="active">SOP Library</a>
      <a routerLink="/suggestions" routerLinkActive="active">Suggestions</a>
    </nav>
    <nav class="workflow-nav" aria-label="Workflows and administration">
      <span class="nav-label">Workflows &amp; administration</span>
      <a *ngIf="lifecycleEnabled" routerLink="/changes" routerLinkActive="active">Change management</a>
      <a routerLink="/sops" routerLinkActive="active">{{lifecycleEnabled ? 'SOP Workspace' : 'SOPs'}}</a>
      <a routerLink="/reports" routerLinkActive="active">Reports</a>
      <a *ngIf="authService.isAdmin()" routerLink="/admin" routerLinkActive="active">Admin</a>
      <ng-container *ngIf="!lifecycleEnabled">
        <a routerLink="/change-requests">Change Dashboard</a>
      </ng-container>
    </nav>
  </aside>

  <div class="main">

    <header class="app-header">
      <div>
        <button class="back-btn" (click)="goBack()">Back</button>
      </div>
      <span class="page-title">SOP Gatekeeper</span>
      <div class="header-right">
        <span *ngIf="!lifecycleEnabled" class="bell" (click)="goToChangeRequest()">
          🔔
          <span class="badge" *ngIf="unreadCount > 0">
            {{ unreadCount }}
          </span>
        </span>

        <button class="logout secondary" (click)="logout()">Logout</button>

      </div>
    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
