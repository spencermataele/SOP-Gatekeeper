<H1>SOP Gatekeeper</H1>

<nav style="display:flex; gap:12px; margin-bottom:12px;">
  <a routerLink="/sops">SOPs</a>
  <a routerLink="/sops/new">Create SOP</a>
  <a routerLink="/admin">Admin</a>
  <a routerLink="/reports">Reports</a>
  <a routerLink="/change-requests">Change Requests</a>

  <span style="flex:1"></span>

  <div style="position:relative; cursor:pointer"
       (click)="goToChangeRequest()">

    <span style="font-size:20px">🔔</span>

    <span *ngIf="unreadCount > 0"
          style="position:absolute; top:-6px; right:-6px; background: red; color: white;
            border-radius: 50%; padding: 2px 6px; font-size: 11px;"
          >{{ unreadCount }}</span>
  </div>
</nav>

<router-outlet></router-outlet>
